
<!DOCTYPE html>
<html>
<head>
    <title>My Birthday Countdown Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #a1c4fd, #c2e9fb);
            font-family: Arial, sans-serif;
        }

        .birthday-card {
            max-width: 650px;
            margin: 60px auto;
            border-radius: 20px;
        }

        .countdown {
            font-size: 25px;
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card birthday-card shadow-lg p-4 text-center">

        <h1 class="text-primary">🎂 Birthday Countdown 🎉</h1>

        <h3 class="mt-3" id="greeting"></h3>

        <hr>

        <h4>My Birthday Details</h4>

        <p><b>Date:</b> 7 October 2014</p>
        <p><b>Birthday Time:</b> 3:00 PM</p>

        <hr>

        <h4>Current Date and Time</h4>

        <p id="currentDate"></p>
        <p id="currentTime"></p>

        <hr>

        <h4>Days Until My Next Birthday</h4>

        <p class="countdown" id="days"></p>

        <h4 class="mt-3">Live Countdown</h4>

        <p class="countdown" id="timer"></p>

        <div class="alert alert-info mt-3">
            🎈 Get ready for the celebration!
        </div>

    </div>

</div>

<script>

    // Birthday details
    let birthday = {
        day: 7,
        month: 9,
        year: 2014,
        hour: 15,
        minute: 0
    };

    // Greeting according to time
    function showGreeting() {

        let hour = new Date().getHours();
        let message;

        if (hour < 12) {
            message = "Good Morning!";
        }
        else if (hour < 17) {
            message = "Good Afternoon!";
        }
        else {
            message = "Good Evening!";
        }

        document.getElementById("greeting").innerHTML = message;
    }

    // Birthday countdown
    function updateCountdown() {

        let now = new Date();

        document.getElementById("currentDate").innerHTML =
            now.toLocaleDateString("en-IN");

        document.getElementById("currentTime").innerHTML =
            now.toLocaleTimeString("en-IN");

        let nextBirthday = new Date(
            now.getFullYear(),
            birthday.month,
            birthday.day,
            birthday.hour,
            birthday.minute
        );

        // If this year's birthday has passed
        if (nextBirthday <= now) {
            nextBirthday.setFullYear(now.getFullYear() + 1);
        }

        let difference = nextBirthday - now;

        let days = Math.floor(difference / (1000 * 60 * 60 * 24));

        let hours = Math.floor(
            (difference / (1000 * 60 * 60)) % 24
        );

        let minutes = Math.floor(
            (difference / (1000 * 60)) % 60
        );

        let seconds = Math.floor(
            (difference / 1000) % 60
        );

        document.getElementById("days").innerHTML =
            days + " Days Left!";

        document.getElementById("timer").innerHTML =
            hours + " Hours : " +
            minutes + " Minutes : " +
            seconds + " Seconds";
    }

    // Run functions
    showGreeting();
    updateCountdown();

    // Update every second
    setInterval(updateCountdown, 1000);

</script>

</body>
</html>
